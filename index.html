    <style>
      /* Base styles */
      :root { 
        --brand-color: #4f46e5;
        --brand-color-hover: #4338ca;
        --brand-color-dark: #818cf8;
        --print-font-size: 10px; 
      }

      /* General Button Styles */
      .btn { display: inline-flex; justify-content: center; align-items: center; padding: 0.5rem 1rem; border: 1px solid transparent; box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05); font-size: 0.875rem; font-weight: 500; border-radius: 0.375rem; transition: all 0.2s; }
      .btn-primary { background-color: var(--brand-color); color: white; }
      .btn-primary:hover { background-color: var(--brand-color-hover); }
      .btn-primary:disabled { background-color: #a5b4fc; cursor: not-allowed; }
      .dark .btn-primary:disabled { background-color: #4338ca; }
      .btn-secondary { background-color: white; color: #374151; border-color: #D1D5DB; }
      .dark .btn-secondary { background-color: #374151; border-color: #4B5563; color: #F9FAFB; }
      .btn-secondary:hover { background-color: #F9FAFB; }
      .dark .btn-secondary:hover { background-color: #4B5563; }
      .btn-ai { padding: 0.25rem; background-color: #E0E7FF; color: #4338CA; border-radius: 9999px; }
      .dark .btn-ai { background-color: #3730A3; color: #C7D2FE; }

      /* Attendance Buttons */
      .btn-present { background-color: #E0E7FF; color: #3730A3; }
      .btn-present-active { background-color: #4338CA; color: white; }
      .btn-late { background-color: #FEF3C7; color: #92400E; }
      .btn-late-active { background-color: #F59E0B; color: white; }
      .btn-absent { background-color: #FEE2E2; color: #991B1B; }
      .btn-absent-active { background-color: #DC2626; color: white; }

      /* Form Styles */
      .label { display: block; font-size: 0.875rem; font-weight: 500; color: #374151; margin-bottom: 0.25rem; }
      .dark .label { color: #D1D5DB; }

      .input-field {
        display: block; width: 100%; padding: 0.5rem 0.75rem; background-color: #F9FAFB;
        border: 1px solid #D1D5DB; border-radius: 0.375rem; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      }
      .dark .input-field { background-color: #1F2937; border-color: #4B5563; color: #F9FAFB; }
      .input-field:focus { outline: 2px solid transparent; outline-offset: 2px; border-color: var(--brand-color); box-shadow: 0 0 0 2px var(--brand-color); }
      
      .input-style { /* For selects or inputs needing an icon */
          composes: input-field;
          appearance: none; -webkit-appearance: none;
          background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
          background-position: right 0.5rem center; background-repeat: no-repeat; background-size: 1.5em 1.5em; padding-right: 2.5rem;
      }
      .dark .input-style {
          background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%239ca3af' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
      }
      .input-style-sm { width: 60px; text-align: center; padding: 4px; border-radius: 4px; border-color: #D1D5DB; }
      .dark .input-style-sm { background-color: #374151; border-color: #4B5563; }

      /* Table Styles */
      .table-container { box-shadow: 0 1px 3px 0 rgba(0,0,0,0.1), 0 1px 2px 0 rgba(0,0,0,0.06); border-radius: 0.5rem; overflow: hidden; }
      .table { min-width: 100%; }
      .th { padding: 0.75rem 1.5rem; background-color: #F9FAFB; text-align: left; font-size: 0.75rem; font-weight: 500; color: #6B7280; text-transform: uppercase; letter-spacing: 0.05em; }
      .dark .th { background-color: #1F2937; color: #9CA3AF; }
      .td { padding: 1rem 1.5rem; white-space: nowrap; }
      
      /* Card Styles */
      .card { background-color: white; border-radius: 0.5rem; box-shadow: 0 1px 3px 0 rgba(0,0,0,0.1), 0 1px 2px 0 rgba(0,0,0,0.06); }
      .dark .card { background-color: #1F2937; }

      /* Print styles */
      @media print {
          body { font-size: var(--print-font-size); -webkit-print-color-adjust: exact; color-adjust: exact; }
          .no-print { display: none; }
          .print-container { max-width: 100%; box-shadow: none; border: 1px solid #ccc; }
          @page { size: A4; margin: 0.5in; }
      }
    </style>
